[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "repoops-handoff"
version = "0.1.0"
description = "Low-noise multi-repository status and coding-agent handoff CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "fabian", email = "42480199+fbientrigo@users.noreply.github.com" }
]
keywords = [
  "git",
  "multi-repository",
  "status",
  "handoff",
  "agent",
  "worklog",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/fbientrigo/repoops-handoff"
Repository = "https://github.com/fbientrigo/repoops-handoff"
Issues = "https://github.com/fbientrigo/repoops-handoff/issues"
Changelog = "https://github.com/fbientrigo/repoops-handoff/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2.1",
  "pytest>=8.2",
  "ruff>=0.5",
  "twine>=5.1.1",
]

[project.scripts]
repoops = "repoops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/repoops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
]
ignore = [
  "B008", # typer.Option()/typer.Argument() in defaults is the required Typer pattern
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

