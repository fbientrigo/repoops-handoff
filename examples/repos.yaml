machine:
  name: nasapcdeb

defaults:
  max_files_per_repo: 12
  include_untracked: true
  include_clean_repos: false
  report_dir: ~/.local/share/repoops/reports
  snapshot_dir: ~/.local/share/repoops/snapshots
  worklog_db: ~/.local/share/repoops/worklog.db

notifications:
  enabled: false
  channel: none  # telegram | slack | email | none

repos:
  - name: dihiggs
    path: ~/dihiggs
    project: DiHiggs
    tags:
      - physics
      - ml

  - name: aws-climate
    path: ~/aws

  - name: apolo-rag
    path: ~/apolo_rag
    project: Apolo
    tags:
      - apolo
      - rag

  - name: charge-monitoring
    path: ~/charge_monitoring_system
    project: ChargeMonitoringSystem
    tags:
      - charge-monitoring
      - embedded
