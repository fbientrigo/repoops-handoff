machine:
  name: nasapcdeb

defaults:
  max_files_per_repo: 12
  include_untracked: true
  include_clean_repos: false
  report_dir: ~/.local/share/repoops/reports
  snapshot_dir: ~/.local/share/repoops/snapshots

notifications:
  enabled: false
  channel: none  # telegram | slack | email | none

repos:
  - name: dihiggs
    path: ~/dihiggs

  - name: aws-climate
    path: ~/aws
